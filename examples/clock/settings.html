<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시계 설정</title>
<body class="desk-body"><h1 class="desk-title">시계 설정</h1><label class="desk-row">초 표시<input id="seconds" class="desk-toggle" type="checkbox"></label><label class="desk-row">12시간제<input id="hour12" class="desk-toggle" type="checkbox"></label><p class="desk-caption">변경 사항은 바로 적용됩니다.</p>
<script>for(const id of ['seconds','hour12']){const input=document.getElementById(id);input.checked=localStorage.getItem(id)==='true'||(id==='seconds'&&localStorage.getItem(id)===null);input.addEventListener('change',()=>localStorage.setItem(id,String(input.checked)));}</script></body></html>
