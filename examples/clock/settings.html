<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { padding: 4px 16px 16px; font-size: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; margin-bottom: 4px;
         background: var(--desk-control-bg); border: 1px solid var(--desk-control-border); border-radius: 6px; }
  .row small { display: block; color: var(--desk-subfg); font-size: 12px; margin-top: 2px; }
  .switch { position: relative; width: 40px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; }
  .track { position: absolute; inset: 0; border-radius: 10px; border: 1px solid var(--desk-subfg); pointer-events: none; transition: background .15s; }
  .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--desk-subfg); transition: transform .15s; }
  input:checked + .track { background: var(--desk-accent); border-color: var(--desk-accent); }
  input:checked + .track::after { background: var(--desk-accent-fg); transform: translateX(20px); }
  p.note { color: var(--desk-subfg); font-size: 12px; margin: 12px 2px 0; }
</style>
</head>
<body>
  <label class="row"><span>24시간제<small>끄면 오전·오후로 보여 줘요.</small></span>
    <span class="switch"><input type="checkbox" id="hour24"><span class="track"></span></span></label>
  <label class="row"><span>초 보이기</span>
    <span class="switch"><input type="checkbox" id="seconds"><span class="track"></span></span></label>
  <label class="row"><span>강조색으로 보이기<small>Windows 강조색을 따라가요.</small></span>
    <span class="switch"><input type="checkbox" id="accent"><span class="track"></span></span></label>
  <p class="note">바꾸면 바로 카드에 반영돼요. 카드 오른쪽 위 톱니나 우클릭 메뉴로 이 화면을 열 수 있어요.</p>
<script>
  const keys = ['hour24', 'seconds', 'accent'];
  let opts = { hour24: true, seconds: false, accent: false };
  const show = () => keys.forEach(k => document.getElementById(k).checked = !!opts[k]);
  try { opts = Object.assign(opts, JSON.parse(localStorage.getItem('clock') || '{}')); } catch { }
  show();
  keys.forEach(k => document.getElementById(k).addEventListener('change', e => {
    opts[k] = e.target.checked;
    localStorage.setItem('clock', JSON.stringify(opts));
  }));
</script>
</body>
</html>
