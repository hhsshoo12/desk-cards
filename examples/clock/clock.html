<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; color: #fff; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; user-select: none; }
  body { display: grid; place-items: center; text-align: center; }
  #t { font-size: 44px; font-weight: 600; letter-spacing: 1px; }
  #d { font-size: 14px; opacity: .7; margin-top: 4px; }
</style>
<div><div id="t"></div><div id="d"></div></div>
<script>
  const t = document.getElementById('t'), d = document.getElementById('d');
  function tick() {
    const n = new Date();
    t.textContent = n.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    d.textContent = n.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
  }
  tick(); setInterval(tick, 1000);
</script>
